<h3 class="mb-16">Categorie</h3>

@if (erroreMsg()) {
  <p class="errore">{{ erroreMsg() }}</p>
}

<table class="tabella">
  <tbody>
    @for (c of categorie(); track c.id) {
      <tr>
        @if (inModifica() === c.id) {
          <td>
            <form class="form-riga" style="margin-top:0" [formGroup]="modificaForm" (ngSubmit)="salvaModifica(c.id)">
              <input formControlName="nome" style="background:var(--card);border:1px solid var(--border);color:var(--ink);padding:8px;" />
              <button class="btn-text lime" type="submit">Salva</button>
              <button class="btn-text" type="button" (click)="inModifica.set(null)">Annulla</button>
            </form>
          </td>
        } @else {
          <td>{{ c.nome }}</td>
          <td>
            <button class="btn-text" (click)="iniziaModifica(c)">Modifica</button>
            <button class="btn-text btn-danger" (click)="elimina(c.id)">Elimina</button>
          </td>
        }
      </tr>
    }
  </tbody>
</table>

<h4 class="mt-24 mb-16">Nuova categoria</h4>
<form class="form-riga" [formGroup]="nuovaForm" (ngSubmit)="crea()">
  <div class="campo" style="margin-bottom:0">
    <label>Nome</label>
    <input formControlName="nome" />
  </div>
  <button class="btn btn-primary" type="submit" [disabled]="nuovaForm.invalid">Crea</button>
</form>
